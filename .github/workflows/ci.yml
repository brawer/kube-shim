name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Pinned to a commit SHA rather than a floating tag (SLSA/OSSF supply-chain hygiene):
        # a tag can be moved or a compromised release republished under the same tag, silently
        # changing what runs in CI. To bump, resolve the new tag to its commit SHA and update
        # both the SHA and the version comment together.

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch HEAD as of 2026-09-15
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run unit and integration tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Run smoke test
        run: ./smoke-test.sh --skip-build
