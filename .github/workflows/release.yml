name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Needed to push the image to ghcr.io.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Pinned to a commit SHA rather than a floating tag (SLSA/OSSF supply-chain hygiene):
        # a tag can be moved or a compromised release republished under the same tag, silently
        # changing what runs in CI. To bump, resolve the new tag to its commit SHA and update
        # both the SHA and the version comment together. Same convention as ci.yml.

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # linux/amd64 only: the target is a standard Hetzner Cloud VPS.
          # Add more platforms here if that ever changes.
          platforms: linux/amd64
          push: true
          # Immutable version tag from the pushed git tag (e.g. v0.1.0),
          # never :latest -- see docs/IMPLEMENTATION_PLAN.md Phase 3 for why
          # (deliberate, manual updates only).
          tags: ghcr.io/${{ github.repository_owner }}/kube-shim:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/kube-shim:${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "First release only: the ghcr.io package defaults to **private** even though this repo is public. Go to the package's settings on GitHub and set visibility to Public, so the VPS can pull it without credentials." >> "$GITHUB_STEP_SUMMARY"
