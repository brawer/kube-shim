[package]
name = "kube-shim"
version = "0.1.0"
edition = "2021"

[lib]
name = "kube_shim"
path = "src/lib.rs"

[[bin]]
name = "kube-shim"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
config = "0.14"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
http = "1.0"
hyper = "1.0"
rustls = "0.23"
rustls-pemfile = "2.0"
clap = { version = "4.0", features = ["derive"] }
# Note: TLS dependencies (rustls, tokio-rustls, etc.) will be added in Phase 2
