[package]
name = "kube-shim"
version = "0.1.13"
edition = "2021"

[lib]
name = "kube_shim"
path = "src/lib.rs"

[[bin]]
name = "kube-shim"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
config = "0.14"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "set-header"] }
http = "1.0"
hyper = "1.0"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4.0", features = ["derive"] }
subtle = "2"
# CronJob schedules use standard 5-field POSIX cron syntax; this crate
# wants a 6-field form (seconds first) -- src/reconcile/schedule.rs
# prepends "0 " to bridge that, see its own comment for why.
cron = "0.17"
# Phase 7: CloudProvider needs to be usable as a trait object (Arc<dyn
# CloudProvider>, shared into the reconciliation loop the same way
# Arc<Notify> already is) -- native async-fn-in-traits isn't dyn-safe, so
# this crate's Box<dyn Future> desugaring is what makes that possible.
async-trait = "0.1"
# default-features disabled to force `ring` instead of the default
# `aws-lc-rs`, matching tls.rs's own crypto-provider choice (ring doesn't
# need a C/cmake toolchain, which matters for cross-compiling to musl --
# see docs/IMPLEMENTATION_PLAN.md Phase 3). "tls12" and "webpki-roots" are
# both on by default upstream and still needed (the latter for the ACME
# directory's own outbound HTTPS calls), so they're re-added explicitly.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum", "tower"] }
tokio-stream = "0.1"
# Phase 9: cloud-init user_data embeds job-supplied values (image/command/
# args/env) as base64 blobs rather than interpolating them into shell text
# directly -- see src/cloud_init.rs's own module docs for why.
base64 = "0.22"
# Phase 10: SSH client to worker VMs (log streaming, real exit-code capture)
# -- never a subprocess. default-features disabled to drop the default
# "aws-lc-rs" crypto backend (needs cmake, unavailable/unwanted in the
# musl/Alpine release build) in favor of "ring", the same substitution
# tls.rs/rustls-acme already make for the exact same reason (Phase 3/4).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
# Phase 10: generates a throwaway keypair for src/ssh.rs's tests, which run
# against a real local russh server rather than a hand-mocked transport --
# same "real local server" testing pattern every other phase's own tests use.
# Pinned to the same major version russh's own dependency tree resolves to
# (verified via `cargo tree`) -- a mismatched rand_core major version fails
# to compile against PrivateKey::random's CryptoRng bound.
rand = "0.10"
